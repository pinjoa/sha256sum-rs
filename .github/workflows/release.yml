name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      next_tag: ${{ steps.tag.outputs.next_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next tag and bump Cargo.toml
        id: tag
        shell: bash
        run: |
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)

          if [ -z "$LAST_TAG" ]; then
            NEXT_TAG="v0.1.0"
          else
            VER=${LAST_TAG#v}
            IFS='.' read -r MA MIN PA <<< "$VER"
            PA=$((PA + 1))
            NEXT_TAG="v${MA}.${MIN}.${PA}"
          fi

          echo "next_tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

          NEW_VER=${NEXT_TAG#v}
          perl -pi -e "s/^version *= *\"[0-9]+\.[0-9]+\.[0-9]+\"/version = \"$NEW_VER\"/" Cargo.toml
          grep '^version' Cargo.toml

      - name: Commit bumped version (optional)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "Bump version for release"
            git push origin HEAD
          fi

      - name: Create and push tag
        env:
          NEXT_TAG: ${{ steps.tag.outputs.next_tag }}
        shell: bash
        run: |
          git tag "$NEXT_TAG"
          git push origin "$NEXT_TAG"

  build-and-release:
    needs: prepare-release
    name: Build and release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build release
        env:
          BUILD_TAG: ${{ needs.prepare-release.outputs.next_tag }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.next_tag }}
        run: |
          BIN_NAME="sha256sum-rs"

          case "${{ matrix.target }}" in
            *windows*)
              BIN_FILE="target/${{ matrix.target }}/release/${BIN_NAME}.exe"
              ;;
            *)
              BIN_FILE="target/${{ matrix.target }}/release/${BIN_NAME}"
              ;;
          esac

          if [ ! -f "$BIN_FILE" ]; then
            echo "Binary not found: $BIN_FILE"
            exit 1
          fi

          ARCHIVE_NAME="${BIN_NAME}-${VERSION}-${{ matrix.target }}.zip"

          mkdir -p dist
          cp "$BIN_FILE" ./dist/
          cd dist

          zip "$ARCHIVE_NAME" "$(basename "$BIN_FILE")"
          rm "$(basename "$BIN_FILE")"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          fi

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare-release.outputs.next_tag }}
        run: |
          $BinName = "sha256sum-rs"
          $BinFile = "target/${{ matrix.target }}/release/${BinName}.exe"
          if (-not (Test-Path $BinFile)) {
            Write-Error "Binary not found: $BinFile"
          }

          $ArchiveName = "$($BinName)-$($Env:VERSION)-${{ matrix.target }}.zip"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $BinFile dist/

          Compress-Archive -Path "dist/$BinName.exe" -DestinationPath "dist/$ArchiveName" -Force
          Remove-Item "dist/$BinName.exe"

          if (Get-Command sha256sum -ErrorAction SilentlyContinue) {
            sha256sum "dist/$ArchiveName" | Out-File "dist/$ArchiveName.sha256" -Encoding ascii
          } elseif (Get-Command shasum -ErrorAction SilentlyContinue) {
            shasum -a 256 "dist/$ArchiveName" | Out-File "dist/$ArchiveName.sha256" -Encoding ascii
          }

      - name: Upload assets to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          tag: ${{ needs.prepare-release.outputs.next_tag }}
          file_glob: true
          overwrite: true
